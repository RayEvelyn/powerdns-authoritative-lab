services:
  internal:
    image: powerdns/pdns-auth-50:5.0.7@sha256:4d6cc4fc42a28f2df7fb55f6f36d8323f96e0da66135ccdad057ca7349b223b4
    entrypoint: ["/usr/bin/tini", "--", "/usr/local/sbin/pdns_server"]
    command: ["--config-dir=/etc/powerdns", "--daemon=no", "--guardian=no"]
    ports: ["127.0.0.1:15353:53/udp", "127.0.0.1:15353:53/tcp"]
    volumes:
      - ./config/pdns.conf:/etc/powerdns/pdns.conf:ro
      - ./config/internal.conf:/etc/powerdns/named.conf:ro
      - ./zones/internal.zone:/zones/example.test.zone:ro
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
  external-demo:
    image: powerdns/pdns-auth-50:5.0.7@sha256:4d6cc4fc42a28f2df7fb55f6f36d8323f96e0da66135ccdad057ca7349b223b4
    entrypoint: ["/usr/bin/tini", "--", "/usr/local/sbin/pdns_server"]
    command: ["--config-dir=/etc/powerdns", "--daemon=no", "--guardian=no"]
    ports: ["127.0.0.1:15354:53/udp", "127.0.0.1:15354:53/tcp"]
    volumes:
      - ./config/pdns.conf:/etc/powerdns/pdns.conf:ro
      - ./config/external.conf:/etc/powerdns/named.conf:ro
      - ./zones/external.zone:/zones/example.test.zone:ro
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
